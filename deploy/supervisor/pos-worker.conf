; Enterprise POS — queue workers under Supervisor (docs/DEPLOYMENT_GUIDE.md "Processes", deploy/README.md).
; Use this OR deploy/systemd/pos-worker@.service, not both. The scheduler then runs from deploy/cron/pos.
; Install: render the placeholders, copy to /etc/supervisor/conf.d/pos-worker.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl status
; Releases: deploy/scripts/release.sh runs `php artisan queue:restart`; each worker finishes its current job,
; exits, and Supervisor starts it again from the new {{APP_ROOT}}/current.
;
; Long jobs: the backup job may run POS_BACKUP_TIMEOUT + 300 s (3900 s by default) and an AI drafts batch up to
; 3600 s. On Redis, set REDIS_QUEUE_RETRY_AFTER in backend/.env above the longest job (e.g. 4000) or a second
; worker starts the same job again after 90 s; stopwaitsecs below lets a running job finish on stop/restart.

[program:pos-worker]
process_name = %(program_name)s_%(process_num)02d
command = {{PHP_BIN}} {{APP_ROOT}}/current/backend/artisan queue:work redis --tries=3 --max-time=3600 --sleep=3
directory = {{APP_ROOT}}/current/backend
user = {{APP_USER}}
numprocs = 2
autostart = true
autorestart = true
startsecs = 5
; SIGTERM: Laravel finishes the job in hand, then exits.
stopsignal = TERM
stopwaitsecs = 3960
stopasgroup = true
killasgroup = true
redirect_stderr = true
stdout_logfile = {{APP_ROOT}}/shared/storage/logs/worker.log
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups = 5
