# Enterprise POS — security headers for the back-office pages served by Nginx (G1a; docs/DEPLOYMENT_GUIDE.md
# "Security checklist"). Included in `location = /admin/builder-canvas` and `location /admin/` of pos.conf.
# An add_header inside a location replaces every server-level add_header, so everything needed is listed here.
# Laravel sends its own headers on PHP responses; these cover only the static admin HTML.
#
# script-src hash: the one inline script in frontend/index.html (theme before first paint).
# frontend/src/app/admin-csp.test.ts checks this line and the guide against that file — change all three together.
# If MEDIA_DISK is an S3 / CDN bucket, add its origin to font-src (uploaded store fonts).
# Roll out as Content-Security-Policy-Report-Only first; open the dashboard, POS, the page builder and a report.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aATtmmR3yaaFhUvWJ3fsT2ob01Z1erl5iZgfzz5pVoY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Laravel sends HSTS on its HTTPS responses (POS_HSTS=true, includeSubDomains). To send it on the admin HTML too:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The HTML must be revalidated so a new release is picked up at once (its assets are immutable).
add_header Cache-Control "no-cache" always;
