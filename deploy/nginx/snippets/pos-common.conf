# Enterprise POS — locations shared by the back office and the storefront server blocks (deploy/nginx/pos.conf).
# Install as /etc/nginx/snippets/pos-common.conf after rendering the placeholders.

server_tokens off;

# Static files come from the frontend build; PHP is only reached through `location = /index.php`.
root {{APP_ROOT}}/current/frontend/dist;
charset utf-8;

# --- Client IP behind a proxy ---------------------------------------------------------------------------------
# Laravel takes the client IP and HTTPS from X-Forwarded-* only when the connecting address is listed in
# TRUSTED_PROXIES (backend/.env, docs/DEPLOYMENT_GUIDE.md). Use ONE of the two approaches:
#   a) (recommended) leave the lines below commented and set TRUSTED_PROXIES to the proxy's addresses;
#   b) let Nginx rewrite the client address: uncomment them and leave TRUSTED_PROXIES empty. Laravel then
#      sees the client as REMOTE_ADDR, but no longer trusts X-Forwarded-Proto — only use (b) when TLS ends
#      in this Nginx.
# Never both: with (b) REMOTE_ADDR is no longer the proxy, so TRUSTED_PROXIES would never match.
# set_real_ip_from 10.0.0.0/8;     # the proxy / load balancer addresses
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

# --- Compression --------------------------------------------------------------------------------------------
# Server level (not http level), so it does not clash with the distro's `gzip on` in nginx.conf.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/csv application/javascript application/json application/xml
           application/rss+xml application/manifest+json image/svg+xml;

# --- Never served ---------------------------------------------------------------------------------------------
# Dotfiles (.env, .git, ...) anywhere; /.well-known stays reachable.
location ~ /\.(?!well-known/) {
    return 404;
}

# The three built HTML pages are only served through their routes (admin locations / the Laravel shell).
location = /index.html          { return 404; }
location = /storefront.html     { return 404; }
location = /builder-canvas.html { return 404; }

# No PHP file other than the front controller.
location ~ \.php$ {
    return 404;
}

# --- Frontend build -------------------------------------------------------------------------------------------
# Hashed file names: cache for a year. Deploy the whole directory and keep the previous build's chunks for a
# while (release.sh carries them over), so open tabs can still load lazy chunks.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# --- Media (php artisan storage:link) -------------------------------------------------------------------------
location ^~ /storage/ {
    root {{APP_ROOT}}/current/backend/public;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.php?$query_string;
}

# Uploaded store fonts (B10): WOFF2 files that never change once written.
location ^~ /storage/fonts/ {
    root {{APP_ROOT}}/current/backend/public;
    types { font/woff2 woff2; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# --- Laravel --------------------------------------------------------------------------------------------------
# robots.txt and sitemaps are generated per storefront host (E12a): never serve a static copy.
location = /robots.txt {
    rewrite ^ /index.php last;
}
location ~ ^/sitemap[^/]*\.xml$ {
    rewrite ^ /index.php last;
}
location ^~ /sitemaps/ {
    rewrite ^ /index.php last;
}

# API, Sanctum, API docs (Scramble, gated by viewApiDocs), the health probe /up. Responses set their own
# headers (security headers, Cache-Control: no-store on private and AI endpoints) — add nothing here.
location ~ ^/(api|sanctum|docs|up)(/|$) {
    rewrite ^ /index.php last;
}

# The storefront home page. Explicit, because `try_files $uri` on "/" would find the dist directory and
# serve its index.html (the admin SPA).
location = / {
    rewrite ^ /index.php last;
}

# Everything else: a real file from the build (favicon.svg, icons.svg, builder-templates/...), else Laravel
# (storefront pages, /go/<code> short links, /feeds/... product feeds — never cache /feeds/ in a CDN).
location / {
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    root {{APP_ROOT}}/current/backend/public;

    include fastcgi_params;
    # $realpath_root resolves the `current` symlink, so each release has its own script paths
    # (new code after a switch even with opcache.validate_timestamps=0) and requests in flight finish
    # on the release they started on.
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
    # fastcgi_params already passes HTTPS ($https) and REQUEST_URI (the original path, which Laravel routes).
    fastcgi_pass unix:{{PHP_FPM_SOCKET}};

    # Above PHP-FPM's request_terminate_timeout (300 s, deploy/php/pos-fpm.conf), so PHP stops first.
    # Long requests: AI questions (several model calls), PDF exports (PDF_TIMEOUT 60 s), builder imports.
    fastcgi_read_timeout 310s;
    fastcgi_send_timeout 310s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_hide_header X-Powered-By;
}
