# Enterprise POS — Nginx site (docs/DEPLOYMENT_GUIDE.md "Target topology", deploy/README.md).
#
# Install: render the placeholders (deploy/README.md), copy this file to /etc/nginx/sites-available/pos.conf
# (or conf.d/), the two snippets to /etc/nginx/snippets/, then `nginx -t && systemctl reload nginx`.
# This file is included inside `http { }`; it sets nothing at http level (distro nginx.conf files already
# set `gzip on`, `server_tokens`, `ssl_protocols`, ... there — a second `gzip on` at http level is an error).
#
# Placeholders:
#   {{APP_ROOT}}          release root (deploy/scripts/release.sh layout): {{APP_ROOT}}/current -> releases/<stamp>
#   {{ADMIN_HOST}}        back office host, e.g. pos.example.com (also APP_URL / SANCTUM_STATEFUL_DOMAINS)
#   {{ADMIN_CERT}}        TLS certificate (full chain) and key for {{ADMIN_HOST}}
#   {{ADMIN_CERT_KEY}}
#   {{STORE_CERT}}        TLS certificate and key for the storefront hosts (see the note on block 3)
#   {{STORE_CERT_KEY}}
#   {{PHP_FPM_SOCKET}}    PHP-FPM pool socket, e.g. /run/php/pos-fpm.sock (deploy/php/pos-fpm.conf)
#   {{ACME_ROOT}}         webroot for Let's Encrypt HTTP-01 challenges, e.g. /var/www/letsencrypt
#
# Routing (same origin for the SPA and the API — required for Sanctum cookie auth):
#   /assets/*                 frontend/dist/assets (static, hashed names, cached for a year)
#   /admin/builder-canvas     frontend/dist/builder-canvas.html   (admin host only)
#   /admin/*                  frontend/dist/index.html             (admin host only)
#   /storage/*                backend/public/storage (media, uploaded fonts), else Laravel
#   everything else           Laravel (backend/public/index.php): /api, /sanctum, /docs, /up, /robots.txt,
#                             /sitemap*.xml, /go/*, /feeds/*, and every storefront page (the Laravel shell
#                             around frontend/dist/storefront.html)
#
# Behind a TLS-terminating load balancer instead: drop the TLS lines and listen on 80 (keep blocks 2 and 3),
# remove block 1's redirect, and set TRUSTED_PROXIES in backend/.env to the balancer's addresses. Do NOT also
# enable `real_ip` below in that case — see the note in snippets/pos-common.conf.

# 1. Plain HTTP: ACME challenges, everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root {{ACME_ROOT}};
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Back office host: admin SPA + builder canvas + API + (optionally) its own storefront.
#    Single-domain install (back office and store on one host): list that host here and nothing changes.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{ADMIN_HOST}};

    ssl_certificate     {{ADMIN_CERT}};
    ssl_certificate_key {{ADMIN_CERT_KEY}};
    ssl_session_cache   shared:pos_ssl:10m;
    ssl_session_timeout 1d;

    # Builder imports accept files up to 30 MB (B16), media uploads 5 MB: keep >= PHP post_max_size.
    client_max_body_size 32m;

    include snippets/pos-common.conf;

    # `/admin` without the slash.
    location = /admin {
        return 301 /admin/;
    }

    # The store builder's canvas (B2): loaded by the editor in an iframe from this origin. Before /admin/.
    location = /admin/builder-canvas {
        include snippets/pos-admin-headers.conf;
        try_files /builder-canvas.html =404;
    }

    # The back-office SPA. `=404` keeps /index.html a file check (served here, with these headers),
    # not an internal redirect into the `location = /index.html` block of pos-common.conf.
    location /admin/ {
        include snippets/pos-admin-headers.conf;
        try_files $uri /index.html =404;
    }
}

# 3. Storefront hosts (every domain added under Online store -> Domains; the backend resolves the
#    organization from the Host header, unknown hosts get Laravel's 404). default_server, because store
#    owners add domains in the app without an Nginx change.
#    TLS: one certificate must cover every host served by this block — a SAN / wildcard certificate,
#    or copy this block once per store domain with its own server_name and certificate (certbot does that),
#    or terminate TLS in front of Nginx (see the header). Each domain's DNS must point at this server.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     {{STORE_CERT}};
    ssl_certificate_key {{STORE_CERT_KEY}};
    ssl_session_cache   shared:pos_ssl:10m;
    ssl_session_timeout 1d;

    # Shoppers upload nothing (form posts, insight beacons <= 64 KB, assistant messages).
    client_max_body_size 2m;

    include snippets/pos-common.conf;

    # No back office on store hosts (Sanctum only accepts {{ADMIN_HOST}} anyway).
    location ^~ /admin {
        return 404;
    }
}
