; Enterprise POS — PHP-FPM 8.4 pool (docs/DEPLOYMENT_GUIDE.md, deploy/README.md).
; Install: render the placeholders, copy to /etc/php/8.4/fpm/pool.d/pos.conf (remove or keep the default www.conf),
; check with `php-fpm8.4 -t`, then `systemctl reload php8.4-fpm`.
;
; Placeholders: {{APP_USER}} / {{APP_GROUP}} — the account that owns {{APP_ROOT}}/shared/storage and runs
; deploy/scripts/release.sh, the queue workers and the scheduler (one account, so files written by the web,
; the workers and the CLI stay writable by all of them); {{NGINX_USER}} — Nginx's user (www-data on Debian/Ubuntu);
; {{PHP_FPM_SOCKET}} — the same path as in deploy/nginx/snippets/pos-common.conf.

[pos]
user = {{APP_USER}}
group = {{APP_GROUP}}

listen = {{PHP_FPM_SOCKET}}
listen.owner = {{NGINX_USER}}
listen.group = {{NGINX_USER}}
listen.mode = 0660

; Size for the server: each child may use up to memory_limit (512M) for a picture edit, but typical API
; requests use 30-60 MB. AI questions and PDF exports hold a child for seconds to minutes, so leave headroom.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Hard stop for one request. Keep it above PDF_TIMEOUT (60 s) and the AI worst case you allow
; (AI_TIMEOUT x (AI_MAX_RETRIES + 1) per call, up to AI_MAX_TOOL_ROUNDS + 1 calls — lower AI_TIMEOUT /
; AI_MAX_RETRIES rather than raising this), and below Nginx's fastcgi_read_timeout (310 s).
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.4-fpm-pos.slow.log

; Status page for monitoring (allow it only from localhost in Nginx if you expose it).
pm.status_path = /fpm-status
ping.path = /fpm-ping

; clear_env = yes (the default) is kept: PHP sees no environment variables from the FPM master. The app reads
; backend/.env, cached by `php artisan optimize`, so nothing is lost — but anything that relies on the
; process environment does not see it in web requests: set POS_PG_BIN (pg_dump folder, needed when
; "Back up now" runs inside a request with QUEUE_CONNECTION=sync), PDF_NODE_BINARY / PDF_CHROME_PATH
; explicitly in backend/.env. PATH below is for the child processes PHP starts (node, chromium, pg_dump).
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp

; Picture edits run in the request (GD, up to 6000 x 6000 px; B11): 512M recommended.
php_admin_value[memory_limit] = 512M
; Builder imports up to 30 MB (B16), media uploads 5 MB. Nginx client_max_body_size is 32m on the admin host.
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 34M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
; Written by the pool user, so not under /var/log. Laravel logs its own errors to storage/logs; this only gets
; what PHP reports before Laravel can (fatal errors at start-up, out of memory).
php_admin_value[error_log] = {{APP_ROOT}}/shared/storage/logs/php-fpm-error.log
; Session cookies are Laravel's; PHP's own session module is unused.
php_admin_flag[session.auto_start] = off
; Also set `expose_php = Off` in /etc/php/8.4/fpm/php.ini (it cannot be set per pool).
