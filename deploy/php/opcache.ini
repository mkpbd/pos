; Enterprise POS — OPcache for PHP-FPM 8.4 (deploy/README.md).
; Install: copy to /etc/php/8.4/fpm/conf.d/99-pos-opcache.ini, then `systemctl reload php8.4-fpm`.
; FPM only: the CLI (artisan, queue workers, scheduler) keeps its own defaults (opcache.enable_cli=0).

opcache.enable = 1
opcache.enable_cli = 0

; ~12 000 PHP files in app/ + vendor/ per release; two releases can be cached during a switch.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.max_wasted_percentage = 10

; Code never changes in place: deploy/scripts/release.sh builds each release in its own directory and Nginx
; passes the resolved path ($realpath_root), so a new release is new files to OPcache. Reload PHP-FPM after
; each release (POS_FPM_SERVICE in release.sh does it) to free the old release's entries — and after editing
; backend/.env + `php artisan optimize` in place, because bootstrap/cache/config.php keeps its path.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Keep doc comments (Scramble's API docs read them).
opcache.save_comments = 1
opcache.enable_file_override = 1

; JIT brings little for request/response PHP; leave it off unless measured.
opcache.jit = disable
